                    proc=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT);log.write(f'\nCommand exit: {proc.returncode}\n')
            (diag/'packaged-info.plist').write_bytes(z.read(prefix+'Info.plist'))
            (diag/'packaged-icon-paths.txt').write_text('\n'.join(icon_paths)+'\n')
            # Reject a localized app-identity override instead of silently rewriting its catalog.
            for n in names:
                if n.startswith(prefix) and n.endswith('.lproj/InfoPlist.strings'):
                    tmp=inspection/'InfoPlist.strings';tmp.write_bytes(z.read(n))
                    values=json.loads(subprocess.check_output(['plutil','-convert','json','-o','-',str(tmp)],text=True))
                    for key in ['CFBundleName','CFBundleDisplayName']:
                        assert key not in values or values[key]=='Metallic',f'Inherited localized identity in {n}: {key}'
            checksum=hashlib.sha256()
            with ipa.open('rb') as stream:
                for chunk in iter(lambda:stream.read(1024*1024),b''): checksum.update(chunk)
            result={'application_sha':os.environ['SOURCE_SHA'],'workflow_sha':os.environ['GITHUB_SHA'],'filename':ipa.name,'size_bytes':ipa.stat().st_size,'sha256':checksum.hexdigest(),'display_name':info['CFBundleDisplayName'],'bundle_identifier':info['CFBundleIdentifier'],'executable':info['CFBundleExecutable'],'icon_verification':'PASS: unchanged M08 artwork hashes + unchanged packaged icon configuration + compiled Assets.car and primary PNGs','java_runtimes':[8,17,21,25],'zip_integrity':'PASS','signing':'Existing ldid sideload entitlements; no provisioning supplied. Installation/resigning and physical JIT/gameplay still require testing.'}
        (diag/'ipa-result.json').write_text(json.dumps(result,indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Validated M08 test IPA\n\n'+json.dumps(result,indent=2)+'\n\nNot proof of installation, JIT attachment or Minecraft gameplay.\n')
        print(json.dumps(result,indent=2))
        PYCODE
      id: ipa
    - name: Save original checkout and scratch mutation diagnostics
      if: always()
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        if [ -d original/.git ]; then
          {
            git -C original rev-parse HEAD
            git -C original diff --stat HEAD --
            git -C original status --short
            git -C original submodule status || true
          } > "$RUNNER_TEMP/metallic-native-build/original-integrity.txt" 2>&1
        fi
        if [ -n "${SCRATCH_DIR:-}" ] && [ -d "$SCRATCH_DIR/.git" ]; then
          {
            git -C "$SCRATCH_DIR" diff --name-status HEAD --
            git -C "$SCRATCH_DIR" status --short | sed -n '1,100p'
          } > "$RUNNER_TEMP/metallic-native-build/scratch-mutations.txt" 2>&1
        fi
        {
          echo '## Test-only build gate'
          echo 'Full native IPA and JIT gameplay are NOT proven by a green compile alone.'
          echo 'Any candidate IPA uses pinned recovered upstream input files that may differ from original Alpha 1.2 dependencies.'
          echo 'Do not release without signing, framework/JRE/JIT payload inspection and physical-device gameplay.'
        } > "$RUNNER_TEMP/metallic-native-build/notice.txt"

        if [ -d original/.git ]; then
          test "$(git -C original rev-parse HEAD)" = "$SOURCE_SHA"
          git -C original diff --exit-code HEAD --
        fi

        if [ -n "${SCRATCH_DIR:-}" ]; then
          python3 - <<'PYCODE'
        from pathlib import Path
        import os,shutil
        root=Path(os.environ['SCRATCH_DIR'])/'ios-app/Natives/build';out=Path(os.environ['RUNNER_TEMP'])/'metallic-native-build/sub-build-logs'
        for p in root.rglob('*build.log'):
            if p.is_file():
                q=out/p.relative_to(root);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
        PYCODE
        fi
      id: integrity
    - name: Upload real native IPA only if compiled and packaged
      if: success() && steps.ipa.outcome == 'success' && steps.integrity.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: metallic-restoration-full-test-ipa-${{ github.run_id }}
        path: ${{ runner.temp }}/metallic-scratch/ios-app/artifacts/*.ipa
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
      id: upload_ipa
    - name: Record final build gate and step outcomes
      if: always()
      shell: bash
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: |-
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        printf '%s\n' "$STEP_OUTCOMES" > "$RUNNER_TEMP/metallic-native-build/step-outcomes.json"
        {
          echo "Application source: $SOURCE_SHA"
          echo "Workflow commit: $GITHUB_SHA"
          echo "Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -f "$RUNNER_TEMP/metallic-native-build/build-exit-code.txt" ]; then
            printf 'make all exit: '; cat "$RUNNER_TEMP/metallic-native-build/build-exit-code.txt"
          else
            echo 'make all: NOT RUN (an earlier gate failed)'
          fi
        } | tee "$RUNNER_TEMP/metallic-native-build/final-status.txt" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload full diagnostic logs even on failure
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: metallic-restoration-diagnostics-${{ github.run_id }}
        path: ${{ runner.temp }}/metallic-native-build/
        if-no-files-found: warn
        compression-level: 6
        retention-days: 7
      id: upload_diagnostics
    permissions:
      contents: read
  prior-diagnostics:
    if: github.repository == 'unfilteredpranxu/metallic-renewed' && github.ref == 'refs/heads/feat/metallic-exact-ui-restoration'
      && contains(github.event.head_commit.message, '[m08-diagnostics]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: Read complete diagnostics from the latest failed build
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: metallic-m08-diagnostics-40809653802
        path: diagnostics
        run-id: '40809653802'
        github-token: ${{ github.token }}
    - name: Record diagnostic provenance
      if: always()
      shell: bash
      run: |-
        mkdir -p diagnostics
        printf '%s\n' '{"origin_run_id":"40739263905","mode":"prior-diagnostics"}' > diagnostics/bridge-origin.json
    - name: Retain retrieved diagnostic evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: metallic-restoration-diagnostics-${{ github.run_id }}
        path: diagnostics/
        if-no-files-found: error
        retention-days: 7
    needs:
    - run-receipt
    timeout-minutes: 10
  publish-diagnostics:
    needs:
    - native-test
    - prior-diagnostics
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out only authorized report destination
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: feat/metallic-exact-ui-restoration
        fetch-depth: 0
        persist-credentials: true
        lfs: false
        submodules: false
        filter: blob:none
        sparse-checkout: /.github/metallic-restoration-reports/
        sparse-checkout-cone-mode: false
    - name: Read this run diagnostic artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: metallic-restoration-diagnostics-${{ github.run_id }}
        path: diagnostics
    - name: Publish CI evidence via normal Git; no source or workflow edits
      env:
        NATIVE_RESULT: ${{ needs.native-test.result }}
        PRIOR_RESULT: ${{ needs.prior-diagnostics.result }}
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import os,json,gzip,shutil,subprocess
        root=Path.cwd();out=root/'.github/metallic-restoration-reports'/os.environ['GITHUB_RUN_ID'];out.mkdir(parents=True,exist_ok=True)
        src=root/'diagnostics';files=[]
        if src.exists():
            for p in src.rglob('*'):
                if not p.is_file() or p.is_symlink() or p.suffix not in ('.json','.txt','.log','.plist','.yaml','.md'):continue
                rel=p.relative_to(src);target=out/rel;target.parent.mkdir(parents=True,exist_ok=True)
                if p.suffix in ('.log','.yaml'):
                    target=Path(str(target)+'.gz')
                    with p.open('rb') as a,gzip.open(target,'wb',compresslevel=6) as b:shutil.copyfileobj(a,b)
                    assert target.stat().st_size<90*1024*1024,'Diagnostic log exceeds safe Git-file limit'
                else:shutil.copy2(p,target)
                files.append(str(target.relative_to(root)))
        meta={'run_id':os.environ['GITHUB_RUN_ID'],'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'application_sha':'5b2d5807e240cf9fbe23b9502ebd71259c62bb2a','workflow_sha':os.environ['GITHUB_SHA'],'native_result':os.environ['NATIVE_RESULT'],'prior_diagnostics_result':os.environ['PRIOR_RESULT'],'files':files}
        (out/'report.json').write_text(json.dumps(meta,indent=2)+'\n')
        subprocess.run(['git','diff','--exit-code','5b2d5807e240cf9fbe23b9502ebd71259c62bb2a','HEAD','--','ios-app'],check=True)
        subprocess.run(['git','add','--',str(out.relative_to(root))],check=True)
        paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
        assert paths and all(p.startswith('.github/metallic-restoration-reports/'+os.environ['GITHUB_RUN_ID']+'/') for p in paths)
        PYCODE
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m "ci: record M08 run $GITHUB_RUN_ID diagnostics"
        git push origin HEAD:refs/heads/feat/metallic-exact-ui-restoration
    timeout-minutes: 10
  run-receipt:
    if: github.repository == 'unfilteredpranxu/metallic-renewed' && github.ref == 'refs/heads/feat/metallic-exact-ui-restoration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out only CI report destination
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: feat/metallic-exact-ui-restoration
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: /.github/metallic-restoration-reports/
        sparse-checkout-cone-mode: false
        lfs: false
        submodules: false
        persist-credentials: true
    - name: Publish exact run receipt; no source changes
      shell: bash
      env:
        RUN_MODE: ${{ contains(github.event.head_commit.message, '[m08-diagnostics]') && 'diagnostics' || 'native-build'
          }}
      run: |-
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import json,os,subprocess
        p=Path('.github/metallic-restoration-reports')/os.environ['GITHUB_RUN_ID'];p.mkdir(parents=True,exist_ok=True)
        data={'run_id':os.environ['GITHUB_RUN_ID'],'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'workflow_sha':os.environ['GITHUB_SHA'],'application_sha':'5b2d5807e240cf9fbe23b9502ebd71259c62bb2a','state':'run-started','mode':os.environ['RUN_MODE']}
        (p/'started.json').write_text(json.dumps(data,indent=2)+'\n')
        subprocess.run(['git','diff','--exit-code','5b2d5807e240cf9fbe23b9502ebd71259c62bb2a','HEAD','--','ios-app'],check=True)
        subprocess.run(['git','add','--',str(p)],check=True)
        PYCODE
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m "ci: record M08 run $GITHUB_RUN_ID start"
        git push origin HEAD:refs/heads/feat/metallic-exact-ui-restoration
    timeout-minutes: 10
'on':
