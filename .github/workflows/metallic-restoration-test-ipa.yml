# Screenshot-defined reconstruction experimental test build. CI evidence commits never match the workflow path trigger.
name: Metallic exact-reference restoration test IPA
run-name: Metallic restoration 5b2d5807 full test IPA
permissions:
  contents: read
concurrency:
  group: metallic-restoration-5b2d5807-test-ipa
  cancel-in-progress: true
jobs:
  native-test:
    if: github.repository == 'unfilteredpranxu/metallic-renewed' && github.ref == 'refs/heads/feat/metallic-exact-ui-restoration'
      && !contains(github.event.head_commit.message, '[m08-diagnostics]')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      SOURCE_SHA: 5b2d5807e240cf9fbe23b9502ebd71259c62bb2a
      AIR_SHA: c4797387ca9a81f31fdcdd2723ec1050ca35fdb3
      ZEROTIER_SHA: b8e672f54286be8500bc875e153826af7b01d6e6
      NG_GL4ES_SHA: 6e153a1622a8d9ef903f7975aafbef2453571bab
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
    - name: Check out exact immutable reconstruction application sources
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: unfilteredpranxu/metallic-renewed
        ref: 5b2d5807e240cf9fbe23b9502ebd71259c62bb2a
        path: original
        persist-credentials: false
        submodules: false
        lfs: true
    - name: Verify source SHA, Metallic identity and immutable artwork before any build
      id: source
      shell: bash
      run: |-
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-01.log") 2>&1
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        test "$(git -C original rev-parse HEAD)" = "$SOURCE_SHA"
        git -C original diff --exit-code HEAD --
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib,json,os,plistlib,subprocess
        src=Path('original'); diag=Path(os.environ['RUNNER_TEMP'])/'metallic-native-build'
        info=plistlib.loads((src/'ios-app/Natives/Info.plist').read_bytes())
        for k,v in {'CFBundleDisplayName':'Metallic','CFBundleName':'Metallic','CFBundleIdentifier':'com.tokyxkai.metallic','CFBundleExecutable':'AngelAuraAmethyst'}.items():
            assert info[k]==v,(k,info.get(k))
        assets=src/'ios-app/Natives/Assets.xcassets'
        assert assets.is_dir()
        manifest={}
        for p in sorted(assets.rglob('*')):
            if p.is_file(): manifest[str(p.relative_to(src))]=hashlib.sha256(p.read_bytes()).hexdigest()
        for contents in assets.rglob('Contents.json'):
            for item in json.loads(contents.read_text()).get('images',[]):
                if item.get('filename'): assert (contents.parent/item['filename']).is_file(),item
        assert (assets/'AppIcon-Light.appiconset/1024x1024.png').is_file()
        expected={'1024x1024.png':'7504cf1938ccfc8ea08a2cd89f03535a1556870464ba2291658698d2771c61fe','1024x1024-Transparent.png':'7504cf1938ccfc8ea08a2cd89f03535a1556870464ba2291658698d2771c61fe','1024x1024-Monochrome-White.png':'3e62a34edc15c57aebff8bbd98572f52d2ce13dc07fe14500a4c3e15f8e99e09'}
        for name,h in expected.items(): assert hashlib.sha256((assets/'AppIcon-Light.appiconset'/name).read_bytes()).hexdigest()==h,name
        (diag/'m08-assets-sha256.json').write_text(json.dumps(manifest,indent=2))
        (diag/'source-identity.json').write_text(json.dumps(info,indent=2))
        (diag/'revisions.json').write_text(json.dumps({k:os.environ.get(k) for k in ['SOURCE_SHA','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_WORKFLOW_REF','GITHUB_RUN_ID','AIR_SHA','ZEROTIER_SHA','NG_GL4ES_SHA']},indent=2))
        print('VERIFIED exact M08 checkout, Metallic metadata and original icon artwork hashes')
        PYCODE
    - name: Install and identify original build toolchain
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
      with:
        distribution: zulu
        java-version: '8'
    - name: Toolchain and prerequisite setup
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-03.log") 2>&1
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        test -d /Applications/Xcode_26.3.app/Contents/Developer
        test "$DEVELOPER_DIR" = /Applications/Xcode_26.3.app/Contents/Developer
        brew list --versions ldid >/dev/null 2>&1 || brew install ldid
        brew list --versions wget >/dev/null 2>&1 || brew install wget
        brew list --versions cmake >/dev/null 2>&1 || brew install cmake
        {
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun clang --version
          xcrun swiftc --version
          make --version
          java -version
          javac -version
          cmake --version
          ldid -h || true
        } > "$RUNNER_TEMP/metallic-native-build/toolchain.log" 2>&1

        test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.2
    - name: Initialize original pinned NG-GL4ES Git submodule
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-04.log") 2>&1
        set -euo pipefail
        test "$(git -C original rev-parse HEAD)" = "$SOURCE_SHA"
        git -C original submodule update --init --depth=1 ios-app/ThirdParty/NG-GL4ES
        git -C original submodule status | tee "$RUNNER_TEMP/metallic-native-build/source-submodules.txt"

        test "$(git -C original/ios-app/ThirdParty/NG-GL4ES rev-parse HEAD)" = "$NG_GL4ES_SHA"
    - name: Retrieve fixed-revision Air and ZeroTier inputs
      shell: bash
      env:
        GIT_LFS_SKIP_SMUDGE: '1'
      run: |
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-05.log") 2>&1
        set -euo pipefail
        cd "$RUNNER_TEMP"
        git init air
        git -C air remote add origin https://github.com/herbrine8403/Amethyst-iOS-MyRemastered.git
        git -C air fetch --filter=blob:none --depth=1 origin "$AIR_SHA"
        git -C air -c advice.detachedHead=false checkout --detach "$AIR_SHA"
        test "$(git -C air rev-parse HEAD)" = "$AIR_SHA"
        git -C air submodule update --init --depth=1 Natives/external/ZeroTierFramework Natives/external/AFNetworking Natives/external/DBNumberedSlider Natives/external/fishhook
        test "$(git -C air/Natives/external/ZeroTierFramework rev-parse HEAD)" = "$ZEROTIER_SHA"
        for p in Natives/installer/modpack/ModrinthAPI.h Natives/input/ControllerInput.m Natives/external/ZeroTierFramework/ios-example-app/zt.framework/zt; do
          test -f "air/$p" || { echo "Missing pinned dependency: $p"; exit 1; }
        done
        {
          echo "Original source: $SOURCE_SHA"
          echo "Air commit: $(git -C air rev-parse HEAD)"
          echo "ZeroTier commit: $(git -C air/Natives/external/ZeroTierFramework rev-parse HEAD)"
          shasum -a 256 air/Natives/installer/modpack/ModrinthAPI.h air/Natives/input/ControllerInput.m air/Natives/external/ZeroTierFramework/ios-example-app/zt.framework/zt
        } | tee "$RUNNER_TEMP/metallic-native-build/pinned-inputs.txt"

        git -C air submodule status --recursive >> "$RUNNER_TEMP/metallic-native-build/pinned-inputs.txt"
    - name: Construct independent scratch build without overwriting any original file
      shell: bash
      run: |-
        mkdir -p "$RUNNER_TEMP/metallic-native-build"
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-06.log") 2>&1
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/original"
        SCRATCH="$RUNNER_TEMP/metallic-scratch"
        mkdir -p "$SCRATCH"
        rsync -a "$SRC/" "$SCRATCH/"
        echo "SCRATCH_DIR=$SCRATCH" >> "$GITHUB_ENV"
        test "$(git -C "$SCRATCH" rev-parse HEAD)" = "$SOURCE_SHA"
        git -C "$SCRATCH" diff --exit-code HEAD --
        python3 - "$RUNNER_TEMP/air/Natives" "$SCRATCH" <<'PYCODE'
        from pathlib import Path
        import os,sys,re,shutil,json,hashlib,collections
        up=Path(sys.argv[1]);root=Path(sys.argv[2]);dst=root/'ios-app/Natives'
        diag=Path(os.environ['RUNNER_TEMP'])/'metallic-native-build';ledger=[]
        def stage(src,target,provenance):
            if os.path.lexists(target): return False
            # Never traverse a symlink/file parent to stage an upstream directory into original inputs.
            for parent in target.parents:
                if parent==root: break
                if parent.is_symlink() or (parent.exists() and not parent.is_dir()): return False
            target.parent.mkdir(parents=True,exist_ok=True)
            if src.is_symlink(): target.symlink_to(os.readlink(src));digest=None
            elif src.is_file(): shutil.copy2(src,target);digest=hashlib.sha256(src.read_bytes()).hexdigest()
            else: return False
            ledger.append({'destination':str(target.relative_to(root)),'source':str(src),'revision':provenance,'sha256':digest,'symlink':os.readlink(src) if src.is_symlink() else None})
            return True
        # Vendor prerequisites referenced by the existing build. Do not hydrate arbitrary upstream UI trees.
        scopes=['external/SimpleFPEWrapper','installer','input','external/ZeroTierFramework','external/AFNetworking','external/DBNumberedSlider','external/NRFileManager','external/UnzipKit','external/fishhook','external/ballpa1n','external/mach','external/AltKit','external/Apple','external/lzma','external/mesa','resources/Frameworks']
        for scope in scopes:
            source=up/scope
            if not source.exists(): continue
            for folder,dirs,files in os.walk(source,followlinks=False):
                for name in list(dirs):
                    if name in ('.git','build'): dirs.remove(name);continue
                    p=Path(folder)/name
                    if p.is_symlink(): dirs.remove(name);stage(p,dst/p.relative_to(up),os.environ['AIR_SHA'])
                for name in files:
                    if name!='.git':
                        p=Path(folder)/name;stage(p,dst/p.relative_to(up),os.environ['AIR_SHA'])
        # Recover complete original localization/storyboard resources; never insert partial tables.
        for source in (up/'resources').glob('*.lproj'):
            for p in source.rglob('*'):
                if p.is_file() or p.is_symlink(): stage(p,dst/p.relative_to(up),os.environ['AIR_SHA'])
        # Missing native units explicitly registered in original CMake, plus their quoted-header closure.
        cmake=(dst/'CMakeLists.txt').read_text()
        cmake='\n'.join(line.split('#',1)[0] for line in cmake.splitlines())
        paths=set(re.findall(r'(?<![\w$])([\w./+-]+\.(?:m|mm|c|cc|cpp|h|hpp|swift))\b',cmake))
        for rel in sorted(paths):
            p=Path(rel)
            if not p.is_absolute() and '..' not in p.parts: stage(up/p,dst/p,os.environ['AIR_SHA'])
        queue=collections.deque(dst/rel for rel in sorted(paths) if (dst/rel).is_file() and (dst/rel).suffix in ('.m','.mm','.c','.cpp','.h','.hpp'))
        seen=set()
        while queue:
            p=queue.popleft()
            if p in seen or not p.is_file(): continue
            seen.add(p)
            for inc in re.findall(r'^\s*#(?:import|include)\s*"([^"\n]+)"',p.read_text(errors='replace'),re.M):
                candidates=[p.parent/inc,dst/inc]
                if any(q.exists() for q in candidates): continue
                for target in candidates:
                    try: rel=target.resolve().relative_to(dst.resolve())
                    except ValueError: continue
                    source=up/rel
                    if source.is_file() and stage(source,target,os.environ['AIR_SHA']): queue.append(target);break
        # Exact M08 script resources at the runtime bundle lookup location, only when absent.
        # These bytes are not taken from upstream and no script implementation is edited.
        for name in ['UniversalJIT26.js','UniversalJIT26Extension.js','JIT26Script.js']:
            source=root/'bundle-templates'/name
            assert source.is_file(),source
            target=dst/'resources'/name
            if os.path.lexists(target):
                assert target.is_file() and target.read_bytes()==source.read_bytes(),f'Existing JIT asset differs from exact M08 template: {target}'
            else: stage(source,target,os.environ['SOURCE_SHA'])
        (diag/'staged-prerequisites.json').write_text(json.dumps(ledger,indent=2))
        expected=json.loads((diag/'m08-assets-sha256.json').read_text())
        for rel,digest in expected.items(): assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
        for rel in ['installer/modpack/ModrinthAPI.h','input/ControllerInput.m','external/ZeroTierFramework/ios-example-app/zt.framework/zt','resources/Frameworks/libEGL.framework/libEGL','resources/Frameworks/libGLESv2.framework/libGLESv2','resources/Frameworks/AltKit.framework/AltKit','resources/Frameworks/CAltKit.framework/CAltKit','resources/Frameworks/UnzipKit.framework/UnzipKit','resources/en.lproj/LaunchScreen.storyboardc']:
            assert (dst/rel).exists(),f'Missing original prerequisite: {rel}'
        print('Staged absent prerequisites:',len(ledger),'; existing paths, symlinks and artwork preserved')
        PYCODE
        git -C "$SCRATCH" diff --exit-code HEAD --
        printf 'Application SHA: %s\nWorkflow SHA: %s\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/metallic-native-build/staging-summary.txt"
    - name: Stage verified Terracotta and Khronos headers into disposable scratch only
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib, json, os, shutil
        run=Path(os.environ['RUNNER_TEMP'])
        repo=Path(os.environ['GITHUB_WORKSPACE'])/'original'
        scratch=Path(os.environ['SCRATCH_DIR'])
        air=run/'air'
        diag=run/'metallic-native-build'
        expected='3f438c8cc07d86cf27d7c0db94cbffb1ef7ce1af65beaf314783d541908d60f9'
        src=air/'Natives/terracotta/libterracotta.xcframework/ios-arm64/libterracotta.a'
        dst=scratch/'ios-app/Natives/terracotta/libterracotta.xcframework/ios-arm64/libterracotta.a'
        assert src.is_file(),f'Pinned Air Terracotta archive missing: {src}'
        def sha256(p):
            h=hashlib.sha256()
            with p.open('rb') as stream:
                for data in iter(lambda:stream.read(1024*1024),b''):
                    h.update(data)
            return h.hexdigest()
        actual=sha256(src)
        assert actual==expected,f'Terracotta SHA-256 mismatch: {actual}'
        for parent in dst.parents:
            if parent==scratch: break
            assert not parent.is_symlink() and (not parent.exists() or parent.is_dir()),f'Unsafe Terracotta parent: {parent}'
        if os.path.lexists(dst):
            assert dst.is_file() and sha256(dst)==expected,'Refusing to replace existing Terracotta input'
        else:
            dst.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(src,dst)
        assert sha256(dst)==expected
        # Genuine existing M08 Khronos headers. Repair only the missing LTW include search path.
        existing=scratch/'ios-app/Natives/external/MobileGlues/MobileGlues-cpp/include'
        src_header=repo/'ios-app/Natives/external/MobileGlues/MobileGlues-cpp/include/GLES3/gl32.h'
        assert existing.is_dir() and (existing/'GLES3/gl32.h').is_file(),'Original Khronos GLES3 header not found'
        assert src_header.is_file() and sha256(src_header)==sha256(existing/'GLES3/gl32.h'),'Source header provenance mismatch'
        search=scratch/'ios-app/Natives/external/MobileGlues/src/main/cpp/include'
        if os.path.lexists(search):
            assert (search/'GLES3/gl32.h').is_file() and sha256(search/'GLES3/gl32.h')==sha256(src_header),'Existing LTW include path is incompatible; refusing overwrite'
        else:
            for parent in search.parents:
                if parent==scratch: break
                assert not parent.is_symlink() and (not parent.exists() or parent.is_dir()),f'Unsafe LTW parent: {parent}'
            search.parent.mkdir(parents=True,exist_ok=True)
            search.symlink_to(os.path.relpath(existing,search.parent),target_is_directory=True)
        assert sha256(search/'GLES3/gl32.h')==sha256(src_header)
        info={
            'source_sha':os.environ['SOURCE_SHA'],
            'air_sha':os.environ['AIR_SHA'],
            'terracotta_sha256':actual,
            'terracotta_archive_bytes':src.stat().st_size,
            'terracotta_stage':'scratch-only; no replacement',
            'gles3_gl32_sha256':sha256(src_header),
            'ltw_include_path':'scratch-only symlink or matching existing directory',
            'deployment_target':'UNCHANGED (iOS 14 source target; Terracotta contains iOS 18.5 objects)',
            'older_os_compatibility':'UNVERIFIED; test IPA only',
        }
        (diag/'m08-recovered-inputs.json').write_text(json.dumps(info,indent=2)+'\n')
        print(json.dumps(info,indent=2))
        PYCODE
        git -C "$GITHUB_WORKSPACE/original" diff --exit-code HEAD --
        git -C "$SCRATCH_DIR" diff --exit-code HEAD --
    - name: Stage pinned Blaze3D shader mirror group with byte verification
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import hashlib, os, shutil, json
        from pathlib import Path
        root=Path(os.environ['SCRATCH_DIR'])
        original=Path(os.environ['GITHUB_WORKSPACE'])/'original'
        air=Path(os.environ['RUNNER_TEMP'])/'air'/'Natives'/'shader_glslang'
        target=root/'ios-app'/'Natives'/'shader_glslang'
        diag=Path(os.environ['RUNNER_TEMP'])/'metallic-native-build'
        manifest=air/'blaze3d_group.txt'
        assert manifest.is_file(),f'Pinned Air group manifest absent: {manifest}'
        assert not os.path.lexists(original/'ios-app/Natives/shader_glslang'),'Source already contains shader group: refuse replacing application assets'
        assert not os.path.lexists(target),'Scratch already contains shader group: refuse replacing assets'
        entries=[];total=0
        for raw in manifest.read_text(encoding='utf-8').splitlines():
            line=raw.strip()
            if not line or line.startswith('#'):continue
            digest, size, name=line.split(None,2)
            assert name.startswith('com/mojang/blaze3d/') and all(x not in ('.','..','') for x in name.split('/')),f'Unsafe class path: {name}'
            assert len(digest)==32 and all(x in '0123456789abcdef' for x in digest),name
            rel=Path(name+'.class')
            src=air/'blaze3d'/rel
            assert src.is_file() and not src.is_symlink(),f'Missing pinned class: {name}'
            data=src.read_bytes()
            assert len(data)==int(size) and hashlib.md5(data).hexdigest()==digest,f'Pinned group source mismatch: {name}'
            entries.append((rel,src,data))
            total+=len(data)
        assert len(entries)==129 and total==557034,f'Unexpected pinned Blaze3D mirror group count/size: {len(entries)}/{total}'
        assert len({str(rel) for rel,_,_ in entries})==len(entries),'Duplicate class paths'
        target.mkdir(parents=True,exist_ok=False)
        shutil.copy2(manifest,target/'blaze3d_group.txt')
        for rel,src,data in entries:
            dst=target/'blaze3d'/rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            assert not os.path.lexists(dst)
            shutil.copy2(src,dst)
            assert dst.read_bytes()==data
        info={'application_sha':os.environ['SOURCE_SHA'],'source_revision':os.environ['AIR_SHA'],'classes':len(entries),'class_bytes':total,'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'archive_role':'Scratch-only shader packaging input; original M08 pack_shader_glslang.py unchanged'}
        (diag/'blaze3d-group-recovery.json').write_text(json.dumps(info,indent=2)+'\n')
        print(json.dumps(info,indent=2))
        PYCODE
        git -C "$GITHUB_WORKSPACE/original" diff --exit-code HEAD --
        git -C "$SCRATCH_DIR" diff --exit-code HEAD --
    - name: Recover exact-M08 SPIRV-Cross CMake templates and mandatory source closure
      shell: bash
      run: |-
        set -euo pipefail
        exec > >(tee "$RUNNER_TEMP/metallic-native-build/step-spirv-recovery.log") 2>&1
        python3 - <<'PYCODE'
        from pathlib import Path
        import os,hashlib,json,subprocess,re
        root=Path(os.environ['SCRATCH_DIR']);original=Path(os.environ['GITHUB_WORKSPACE'])/'original';air=Path(os.environ['RUNNER_TEMP'])/'air';diag=Path(os.environ['RUNNER_TEMP'])/'metallic-native-build'
        large='ios-app/Natives/external/MobileGlues/MobileGlues-cpp/3rdparty/SPIRV-Cross'
        small='ios-app/Natives/external/MobileGlues/src/main/cpp/3rdparty/SPIRV-Cross'
        src=original/large;dst=root/small
        assert subprocess.check_output(['git','-C',str(original),'rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_SHA']
        for rel,tree in [(large,'514ed4f4455ff6451866ad99bfae55955cd5eb92'),(small,'08a3bfc528225335563051f4637a60f6d52bcf90')]:
            assert subprocess.check_output(['git','-C',str(original),'rev-parse',os.environ['SOURCE_SHA']+':'+rel],text=True).strip()==tree,rel
        assert subprocess.check_output(['git','-C',str(air),'rev-parse','HEAD'],text=True).strip()==os.environ['AIR_SHA']
        # Both original trees have the SAME existing 31 file contents, including CMakeLists.
        # Recover only missing build inputs; never copy from the later dep_mg-aligned tree.
        shared=[]
        for p in sorted((original/small).rglob('*')):
            if not p.is_file():continue
            rel=p.relative_to(original/small);other=src/rel
            assert not p.is_symlink() and other.is_file() and p.read_bytes()==other.read_bytes(),f'Incompatible original SPIRV-Cross revisions: {rel}'
            assert (dst/rel).is_file() and (dst/rel).read_bytes()==p.read_bytes(),f'Existing scratch SPIRV-Cross changed: {rel}'
            shared.append(str(rel))
        assert len(shared)==31,shared
