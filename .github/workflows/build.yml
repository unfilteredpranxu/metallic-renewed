name: Build iOS
on:
  workflow_dispatch:
  jobs:
    build:
        runs-on: macos-latest
            steps:
                  - uses: actions/checkout@v4
                          with:
                                    lfs: true
                                          - name: Show tool versions
                                                  run: |
                                                            xcodebuild -version
                                                                      make --version
                                                                            - name: Build
                                                                                    working-directory: ios-app
                                                                                            run: make
                                                                                                  - name: Upload result
                                                                                                          if: always()
                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                          with:
                                                                                                                                    name: metallic-build
                                                                                                                                              path: |
                                                                                                                                                          ios-app/**/*.ipa
                                                                                                                                                                      ios-app/build/Release-iphoneos/
                                                                                                                                                                                if-no-files-found: warn