#
# Crowdin configuration — Amethyst-iOS-Remastered
# Source language: Simplified Chinese (zh-CN); target languages: English / Traditional Chinese / Japanese / Khmer
# Source files and translations are in Natives/resources/<locale>.lproj/Localizable.strings.
# The iOS folder language codes are aligned with Crowdin language codes through languages_mapping:
#   zh-CN (Simplified Chinese, source) -> zh-Hans / zh-TW (Traditional Chinese) -> zh-Hant / en / ja / km
#
project_id: "921973"

# Path relative to the repository root that points to the directory containing the .lproj folders
base_path: "/Natives/resources"

files:
  - source: "/zh-Hans.lproj/Localizable.strings"
    translation: "/%locale%.lproj/Localizable.strings"
    languages_mapping:
      locale:
        en: en
        zh-TW: zh-Hant
        ja: ja
        km: km