"*.deb" -o -name "*.tipa" \) -not -path "*/node_modules/*" | head -50
          echo "---- ios-app top level ----"
          ls -la ios-app || true
          echo "---- ios-app/artifacts ----"
          ls -laR ios-app/artifacts 2>/dev/null | head -50 || true

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metallic-build
          path: |
            ios-app/artifacts/
            ios-app/**/*.ipa
            ios-app/**/*.tipa
            ios-app/**/*.deb
            ios-app/build/Release-iphoneos/
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-app/build.log
          if-no-files-found: warn
