name: Build iOS

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Install tools
        run: brew install ldid wget

      - name: Show tool versions
        run: |
          xcodebuild -version
          make --version
          java -version
          javac -version
          echo $JAVA_HOME

      - name: Clone upstream
        run: |
          set -e
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/herbrine8403/Amethyst-iOS-MyRemastered.git /tmp/upstream \
            || { rm -rf /tmp/upstream; git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/AngelAuraMC/Amethyst-iOS.git /tmp/upstream; }
          cd /tmp/upstream
          cat .gitmodules || true
          git submodule foreach --quiet --recursive 'echo $displaypath' > /tmp/subpaths.txt
          echo "---- upstream submodule paths ----"
          cat /tmp/subpaths.txt

      - name: Fill in missing submodules from upstream
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          while read -r p; do
            [ -z "$p" ] && continue
            mkdir -p "ios-app/$p"
            rsync -a --ignore-existing --exclude '.git' "/tmp/upstream/$p/" "ios-app/$p/"
          done < /tmp/subpaths.txt

      - name: Fill in missing Natives files from upstream
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # Copies every file that is missing from Natives (input/, installer/, external/, ...)
          # File by file, so a folder/file mismatch can never break the step.
          # Existing files are never overwritten.
          cd /tmp/upstream/Natives
          copied=0
          while IFS= read -r -d '' f; do
            dest="$GITHUB_WORKSPACE/ios-app/Natives/$f"
            if [ ! -e "$dest" ] && [ ! -L "$dest" ]; then
              mkdir -p "$(dirname "$dest")" 2>/dev/null || continue
              cp -P "$f" "$dest" 2>/dev/null && copied=$((copied+1)) || true
            fi
          done < <(find . -name .git -prune -o \( -type f -o -type l \) -print0)
          echo "Copied $copied missing files from upstream"
          cd "$GITHUB_WORKSPACE"

          echo "---- Natives/input ----"
          ls -la ios-app/Natives/input || echo "input folder MISSING"
          echo "---- Natives/installer ----"
          ls -la ios-app/Natives/installer || echo "installer folder MISSING"
          echo "---- Natives/external ----"
          ls -la ios-app/Natives/external || true
          echo "---- NRFileManager ----"
          ls -la ios-app/Natives/external/NRFileManager || echo "NRFileManager MISSING"
          echo "---- FabricInstallViewController ----"
          find ios-app -name "FabricInstallViewController*" | head -20

          # Fail early with a clear message instead of a CMake error later
          test -f ios-app/Natives/input/ControllerInput.m \
            || { echo "ERROR: Natives/input/ControllerInput.m is missing in both your repo and upstream"; exit 1; }

      - name: Check CMake source files exist
        run: |
          cd "$GITHUB_WORKSPACE/ios-app/Natives"
          echo "---- Source files referenced in CMakeLists.txt that do not exist ----"
          grep -oE '[A-Za-z0-9_./-]+\.(m|mm|c|cpp|swift)' CMakeLists.txt | sort -u | while read -r f; do
            [ -f "$f" ] || echo "MISSING: $f"
          done || true

      - name: Fetch ZeroTier framework
        run: |
          DEST=ios-app/Natives/external/ZeroTierFramework
          if [ ! -d "$DEST/ios-example-app/zt.framework" ]; then
            rm -rf "$DEST"
            mkdir -p "$(dirname "$DEST")"
            git clone --depth 1 https://github.com/zerotier/zerotier-sockets-apple-framework.git "$DEST"
          fi
          ls -la "$DEST" "$DEST/ios-example-app" || true
          test -d "$DEST/ios-example-app/zt.framework"

      - name: Verify home UI source files
        run: |
          cd "$GITHUB_WORKSPACE/ios-app/Natives"
          for source in HomeActionPanelView.m HomeTopNavView.m BottomActionBarView.m; do
            test -f "$source" || { echo "Missing home UI source: $source"; exit 1; }
          done

      - name: Resolve missing classes from your repo
        run: |
          cd "$GITHUB_WORKSPACE"
          # Every class listed here gets its .m/.mm added to CMakeLists.txt (runner copy only,
          # your repo is never modified) if it exists in your project but is not listed there yet.
          # Add any class name the linker reports as: "_OBJC_CLASS_$_Name", referenced from ...
          CLASSES="HomeActionPanelView HomeTopNavView BottomActionBarView"
          # Classes whose header must also be imported into LauncherNewsViewController.m
          # (only needed for the one that was reported as "unknown type name")
          IMPORT_CLASSES="HomeActionPanelView"

          for c in $CLASSES; do
            echo "==================== $c ===================="
            echo "-- files in your project:"
            find ios-app \( -name "$c.h" -o -name "$c.m" -o -name "$c.mm" \) -not -path "*/.git/*" | head
            echo "-- files that mention it in your project:"
            grep -rl "$c" ios-app --include=*.h --include=*.m --include=*.mm --include=CMakeLists.txt 2>/dev/null | head
            m=$(find ios-app/Natives \( -name "$c.m" -o -name "$c.mm" \) -not -path "*/.git/*" | head -1)
            if [ -n "$m" ]; then
              relm="${m#ios-app/Natives/}"
              if ! grep -q "$relm" ios-app/Natives/CMakeLists.txt; then
                awk -v rel="$relm" '{print} /LauncherNewsViewController\.m/ && !done {match($0,/^[ \t]*/); print substr($0,1,RLENGTH) rel; done=1}' \
                  ios-app/Natives/CMakeLists.txt > /tmp/CMakeLists.new && mv /tmp/CMakeLists.new ios-app/Natives/CMakeLists.txt
                echo "ADDED $relm to CMakeLists.txt (runner only)"
              else
                echo "$relm is already listed in CMakeLists.txt"
              fi

              case " $IMPORT_CLASSES " in
                *" $c "*)
                  h=$(find ios-app -name "$c.h" -not -path "*/.git/*" | head -1)
                  n=$(find ios-app/Natives -name "LauncherNewsViewController.m" | head -1)
                  echo "---- header found at: $h"
                  if [ -n "$h" ] && [ -n "$n" ] && ! grep -q "$c.h" "$n"; then
                    relh=$(python3 -c "import os,sys;print(os.path.relpath(sys.argv[1],sys.argv[2]))" "$h" "$(dirname "$n")")
                    awk -v h="$relh" '{print} /^#import/ && !d {print "#import \"" h "\""; d=1}' "$n" > /tmp/lnvc.new && mv /tmp/lnvc.new "$n"
                    echo "NOTE (runner only, your repo is unchanged): added #import \"$relh\" to $n"
                  fi
                  ;;
              esac
            else
              echo "ERROR: $c.m is NOT in your repo, so the build cannot compile it."
              echo "Did you commit and push it? Is it hidden by .gitignore?"
              git check-ignore -v "ios-app/Natives/$c.m" "ios-app/Natives/$c.h" || echo "(not ignored by .gitignore)"
              echo "Files git knows about with a similar name:"
              git ls-files | grep -i "$c" || echo "none"
            fi
          done

          echo "---- Other .m/.mm files in Natives that are NOT listed in CMakeLists.txt (info only) ----"
          cd ios-app/Natives
          find . -path ./external -prune -o \( -name '*.m' -o -name '*.mm' \) -print | sed 's#^\./##' | while read -r f; do
            grep -qF "$f" CMakeLists.txt || echo "NOT LISTED: $f"
          done || true

      - name: Runner-only source fixes
        run: |
          cd "$GITHUB_WORKSPACE/ios-app/Natives"
          # AI/AiAssetTools.m: second ternary operand is a C string (missing @), which is a compile error.
          # Patched on the runner only; your repo is not modified.
          f=$(find . -ipath "./AI/AiAssetTools.m" | head -1)
          if [ -n "$f" ] && grep -qF 'isQuilt ? @"" : ", and Fabric API' "$f"; then
            sed -i.bak 's/isQuilt ? @"" : ", and Fabric API/isQuilt ? @"" : @", and Fabric API/' "$f" && rm -f "$f.bak"
            echo "Patched $f (runner only)"
          else
            echo "AiAssetTools.m patch not needed or pattern not found"
          fi

      - name: Build
        shell: bash
        working-directory: ios-app
        run: |
          set -o pipefail
          make all \
            BOOTJDK=$JAVA_HOME/bin \
            SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path) \
            2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          cd ios-app
          echo "---- Real errors (ld warnings excluded) ----"
          grep -nE "error:|Undefined symbols|symbol\(s\) not found|No rule to make target|CMake Error|\*\*\* \[" build.log | head -40 || true
          echo "---- Undefined symbols (with referencing files) ----"
          grep -A4 "Undefined symbols" build.log | head -60 || true
          echo "---- Every missing symbol ----"
          grep -E '^ *"_OBJC_CLASS_\$_|^ *"_[A-Za-z0-9_]+", referenced from' build.log | sort -u | head -40 || true

      - name: Annotate real errors
        if: failure()
        run: |
          cd ios-app
          # Real compiler/linker errors only (skips the NSError "error:" method-signature noise)
          grep -nE "(fatal )?error: |ld: |Undefined symbols|undefined symbol|No rule to make target|CMake Error|\*\*\* \[" build.log \
            | grep -vE "NSError|-Wdeprecated|warning:" | head -8 \
            | while IFS= read -r l; do echo "::error title=build error::$(printf '%s' "$l" | cut -c1-500)"; done
          # Lines right before the first make failure
          n=$(grep -nE "\*\*\* \[" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            ctx=$(sed -n "$((n>25?n-25:1)),${n}p" build.log | grep -v "warning" | cut -c1-300 | head -25 | awk '{printf "%s%%0A", $0}')
            echo "::error title=before first make failure::${ctx}"
          fi
          # Missing Objective-C classes / symbols
          grep -E '"_OBJC_CLASS_\$_|, referenced from' build.log | sort -u | head -8 \
            | while IFS= read -r l; do echo "::error title=missing symbol::$(printf '%s' "$l" | cut -c1-300)"; done

      - name: Confirm IPA output
        if: success()
        run: |
          find ios-app/artifacts -maxdepth 1 -type f -name "*.ipa" -print
          test -n "$(find ios-app/artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"

      - name: Upload compiled IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metallic-ipa
          path: ios-app/artifacts/*.ipa
          if-no-files-found: error
          
