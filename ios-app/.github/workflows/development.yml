name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-15

    # Publishing a nightly release requires contents: write.
    permissions:
      contents: write

    steps:
      - name: Select Xcode (prefer 26+ for iOS 26 Liquid Glass, fallback 15.4)
        run: |
          echo "== Available Xcode versions =="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "== Default =="
          xcodebuild -version || true
          # Select the newest Xcode >= 26 (Liquid Glass requires the iOS 26 SDK); fall back to 15.4 if unavailable.
          PICK=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r); do
            PICK="$app"; break
          done
          if [ -z "$PICK" ]; then
            for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
              v=$(basename "$app" | sed -E 's/Xcode_?([0-9]+).*/\1/')
              if [ -n "$v" ] && [ "$v" -ge 26 ] 2>/dev/null; then PICK="$app"; break; fi
            done
          fi
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "★ Selected $PICK"
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
            echo "★ Xcode 26 not found; falling back to 15.4 (this build will not include the new iOS 26 appearance)"
          fi
          xcodebuild -version || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo '?')
          SDKPATH_REAL=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo '')
          echo "★ iPhoneOS SDK = $SDK"
          echo "★ SDKPATH = $SDKPATH_REAL"
          # ★ Important: the Makefile uses SDKPATH ?= ... (?= does not overwrite an existing value).
          #   If the environment contains an old SDKPATH or CMake cached an old CMAKE_OSX_SYSROOT,
          #   the build will use the old SDK and the packaged app will not get the new iOS 26 appearance.
          #   Explicitly write these values to GITHUB_ENV to force all later steps to use the same SDK.
          echo "SDKPATH=$SDKPATH_REAL" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "★ Wrote SDKPATH / DEVELOPER_DIR to GITHUB_ENV"

      - name: Fix Homebrew openssl link (openssl@1.1 vs openssl@3)
        run: |
          # The runner image still registers /opt/homebrew/bin/openssl as belonging to openssl@1.1,
          # causing linking to fail when a later brew install (e.g. ldid) upgrades openssl@3 to 3.6.5
          # (Could not symlink bin/openssl / Target is a symlink belonging to openssl@1.1).
          sudo rm -f /opt/homebrew/bin/openssl || true
          brew unlink openssl@1.1 || true
          brew uninstall --ignore-dependencies openssl@1.1 || true
          brew link --overwrite openssl@3 || true
          ls -l /opt/homebrew/bin/openssl || true

      - name: Install GNU Make
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew update || true
          brew install make || true

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Drop stale submodule gitlinks
        # Historical context: MobileGL was once added as a submodule. An upstream force push
        # removed its pinned commit, and orphaned gitlinks kept being reintroduced; this step cleaned them up.
        # MobileGL is now a vendored source directory like MobileGlues (see
        # .github/workflows/vendor-mobilegl.yml), not a gitlink.
        # Therefore, clean it up only when git ls-files -s reports mode 160000 (a genuine gitlink),
        # to avoid removing the vendored source directory from the index.
        run: |
          for p in Natives/external/MobileGL Natives/external/MobileGlues; do
            mode=$(git ls-files -s -- "$p" 2>/dev/null | awk '{print $1}')
            if [ "$mode" = "160000" ]; then
              echo "dropping stale gitlink: $p"
              git rm --cached -f "$p" || true
              git config --remove-section "submodule.$p" 2>/dev/null || true
            else
              echo "$p is a regular path (mode=${mode:-none}), keeping"
            fi
          done

      - name: Checkout repository submodules
        env:
          # MobileGL upstream has exhausted its LFS quota. Its LFS files (tools/trace_replay/fixtures)
          # are irrelevant to the iOS build; skip smudging to avoid submodule checkout failure (exit 128).
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      # ===== The following four steps were contributed by collaborators (cache/validation improvements). =====
      # ★ Corrected merge order: clear the CMake cache first, then restore dependency caches.
      #   (The original collaborator version put Purge after Cache, immediately deleting the restored
      #    Natives/build/mobileglues and Natives/build/sfpew directories and conflicting with caching;
      #    the order is corrected here.)
      - name: Purge stale CMake/build caches (force re-resolve with the selected SDK)
        run: |
          # ★ Old build caches retain CMAKE_OSX_SYSROOT. After changing Xcode/SDK, force CMake to re-resolve it,
          #   or it will keep building with the old SDK and the output will not use the iOS 26 appearance
          #   (evidence: the previous artifact's LC_BUILD_VERSION reported SDK=16.0, while 26.3 was selected).
          # Note: remove only pure CMake output directories; preserve dependency artifacts under Natives/build
          #       (mobileglues / sfpew / java_runtimes / assets are provided by the cache).
          rm -rf build JavaApp/build 2>/dev/null || true
          rm -rf Natives/build/CMakeCache.txt Natives/build/CMakeFiles 2>/dev/null || true
          echo "★ Cleared build directories ⇒ the next configure will probe the SDK for the selected Xcode"
          echo "★ Current SDKPATH=${SDKPATH:-unset}"
          echo "★ DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"

      - name: Cache heavy 3rd-party builds (MobileGlues / glslang / SPIRV-Cross / LTW / SFPEW)
        uses: actions/cache@v4
        with:
          path: |
            Natives/build/mobileglues
            Natives/build/mobileglues/3rdparty
            Natives/build/sfpew
            Natives/external/LTW/ltw/src/main/tinywrapper
          key: dep3rd-${{ runner.os }}-xcodeauto-${{ hashFiles('Makefile') }}
          restore-keys: |
            dep3rd-${{ runner.os }}-

      - name: Cache JRE and game assets downloads
        uses: actions/cache@v4
        with:
          path: |
            Natives/build/java_runtimes
            Natives/build/assets
            ~/Library/Caches/Amethyst
          key: jre-assets-${{ runner.os }}-xcodeauto-${{ hashFiles('Makefile') }}
          restore-keys: |
            jre-assets-${{ runner.os }}-

      # ==== [cache-proof] Print cache-hit evidence on every run ====
      - name: Cache evidence
        run: |
          echo "==== cache state ===="
          for d in Natives/build/mobileglues Natives/build/sfpew Natives/build/java_runtimes Natives/build/assets; do
            if [ -d "$d" ]; then
              echo "HIT  $d : $(find "$d" -type f 2>/dev/null | wc -l) files, $(du -sh "$d" 2>/dev/null | cut -f1)"
              echo "     newest: $(find "$d" -type f -newermt '-10 minutes' 2>/dev/null | wc -l) files touched in last 10min"
            else
              echo "MISS $d (absent)"
            fi
          done
          echo "====================="

      # Note: do not reference secrets / vars in an `if:` condition.
      # GitHub Actions evaluates these contexts while compiling the workflow;
      # evaluating vars before the repository has any variables can fail and prevent the entire workflow
      # from compiling (the run immediately fails, jobs total_count=0, and logs return 404).
      # Put all condition logic in the shell; referencing them in env: is the safe, standard approach.
      #
      # Mithril needs no download step: libmithril.dylib is committed under
      # Natives/resources/Frameworks/ and is bundled with Natives/resources/*.
      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
          # Used by the make command below (controls whether dep_mobilegl builds MobileGL from repository source).
          # Referencing vars in env: is officially supported. Do not put
          # `export BUILD_MOBILEGL=${{ vars.BUILD_MOBILEGL || '0' }}` in run:;
          # vars would still be evaluated while compiling the workflow.
          BUILD_MOBILEGL: ${{ vars.BUILD_MOBILEGL }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0
          export BUILD_MOBILEGL="${BUILD_MOBILEGL:-1}"
          echo "[ci] BUILD_MOBILEGL=${BUILD_MOBILEGL} vars=${{ vars.BUILD_MOBILEGL }} src=$(test -d Natives/external/MobileGL && echo yes || echo no)"

          # Save the complete gmake output to disk: CI job logs and artifacts use blob storage,
          # which external users (including repository collaborators) cannot retrieve, leaving build errors to guesswork.
          # The "Publish iOS build log to repo" step below commits this log on failure
          # (raw content is readable), making it possible to locate the exact file and line.
          # pipefail is enabled above, so gmake's nonzero exit code still propagates through tee.
          mkdir -p ci-logs
          which gmake || echo "[ci] WARNING: gmake not on PATH"
          gmake --version 2>&1 | head -1 || echo "[ci] WARNING: gmake --version failed"

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} 2>&1 | tee ci-logs/ios-build.log

            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 2>&1 | tee ci-logs/ios-build-trollstore.log

          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 2>&1 | tee ci-logs/tvos-build.log

          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} 2>&1 | tee ci-logs/build.log
          fi

      - name: Surface iOS build errors as check annotations
        # Actual compilation errors from the main build (gmake dsym package) exist only in the job log.
        # The job log and artifact use blob storage and cannot be retrieved externally (including by collaborators),
        # so previously the failure could only be guessed at.
        # Convert error lines from the log into check annotations using workflow commands:
        # the check-runs annotations API then exposes the exact file and line.
        # Join multiple lines in a single annotation with %0A to avoid truncation by the "10 per level" limit.
        if: matrix.platform_name == 'ios' && always()
        continue-on-error: true
        run: |
          LOG=ci-logs/ios-build.log
          [ -f "$LOG" ] || LOG=ci-logs/ios-build-trollstore.log
          if [ ! -f "$LOG" ]; then echo "[ci] no ios build log captured"; exit 0; fi
          echo "[ci] build log: $LOG ($(wc -l < "$LOG") lines)"
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          MSG=$(grep -nE "error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: |No rule to make target|\*\*\* " "$LOG" | head -25 | esc | awk '{printf "%s%%0A", $0}')
          if [ -n "$MSG" ]; then
            echo "::error title=build-errors::$MSG"
          else
            echo "::error title=build-errors::(no error: line matched -- see tail)"
          fi
          TAIL=$(tail -20 "$LOG" | esc | awk '{printf "%s%%0A", $0}')
          echo "::error title=build-tail::$TAIL"

      - name: Upload MobileGL dylib (if built)
        # MobileGL is built from source, with its output under Natives/build/. Upload a separate copy,
        # so after validation the dylib can be retrieved and committed directly without downloading and extracting the 195 MB IPA.
        # If BUILD_MOBILEGL is disabled or the build fails, the directory does not exist; hashFiles skips this step.
        if: matrix.platform_name == 'ios' && success() && hashFiles('Natives/build/libMobileGL.dylib') != ''
        uses: actions/upload-artifact@v4
        with:
          name: libMobileGL.dylib
          path: Natives/build/libMobileGL.dylib
          if-no-files-found: ignore

      - name: Upload MobileGL GLES dylib (if built)
        if: matrix.platform_name == 'ios' && success() && hashFiles('Natives/build/libMobileGL-gles.dylib') != ''
        uses: actions/upload-artifact@v4
        with:
          name: libMobileGL-gles.dylib
          path: Natives/build/libMobileGL-gles.dylib
      - name: Commit MobileGL dylibs back to repo (one-shot)
        # Never let failure of this step break the IPA artifact: committing is optional, and the dylib
        # has already been uploaded as an artifact for direct retrieval.
        continue-on-error: true
        if: matrix.platform_name == 'ios' && success() && hashFiles('Natives/build/libMobileGL.dylib') != '' && hashFiles('Natives/build/libMobileGL-gles.dylib') != '' && vars.COMMIT_MOBILEGL == '1'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -e -x
          # Commit the CI-built dylibs back to the repository to avoid rebuilding glslang + SPIRV-Cross
          # on every build (about 20–30 minutes on a macOS runner; Actions charges macOS at 10x).
          # The unstripped dylibs are about 90 MB each. Git's default http.postBuffer is only 1 MB,
          # causing HTTP 413 / send-pack disconnects on large pushes, so increase it to 500 MB.
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 300
          cp Natives/build/libMobileGL.dylib Natives/resources/Frameworks/libMobileGL.dylib
          cp Natives/build/libMobileGL-gles.dylib Natives/resources/Frameworks/libMobileGL-gles.dylib
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Natives/resources/Frameworks/libMobileGL.dylib Natives/resources/Frameworks/libMobileGL-gles.dylib
          if git diff --cached --quiet; then
            echo "[ci] MobileGL dylibs unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(mobilegl): publish prebuilt iOS MobileGL artifacts [skip ci]"
          # New commits may have landed in the meantime; rebase before pushing. If it still fails,
          # print the remote state to help diagnose the problem.
          if ! git push origin HEAD:"$BRANCH_NAME"; then
            echo "[ci] Initial push failed; trying again after pull --rebase"
            git pull --rebase origin "$BRANCH_NAME" || true
            git push origin HEAD:"$BRANCH_NAME"
          fi
          echo "[ci] MobileGL dylibs committed: libMobileGL.dylib (DirectVulkan), libMobileGL-gles.dylib (DirectGLES)"

      - name: Upload SFPEW build log
        # dep_sfpew is invoked with `-$(MAKE)`, so failure does not stop the main build and its details are silently swallowed.
        # Always upload the saved CMake/build log here to aid diagnosis.
        if: matrix.platform_name == 'ios' && always() && hashFiles('Natives/build/sfpew_build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sfpew-build.log
          path: Natives/build/sfpew_build.log
          if-no-files-found: ignore

      - name: Upload SFPEW dylib
        # Whether the dylib exists is the only definitive evidence that SFPEW actually built.
        if: matrix.platform_name == 'ios' && always() && hashFiles('Natives/build/libSimpleFPEWrapper.dylib') != ''
        uses: actions/upload-artifact@v4
        with:
          name: libSimpleFPEWrapper.dylib
          path: Natives/build/libSimpleFPEWrapper.dylib
          if-no-files-found: ignore

      - name: Upload MobileGL build log
        # MobileGL is built from source; historically, nine commits in the Air repository failed to build it.
        # The payload invokes it with `-$(MAKE) dep_mobilegl`, so failure does not stop the main build
        # and the reason is silently swallowed. Always upload the dep_mobilegl log here
        # (including diagnostics and the actual exit code) to aid diagnosis.
        if: matrix.platform_name == 'ios' && always() && hashFiles('mobilegl-build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mobilegl-build.log
          path: mobilegl-build.log
          if-no-files-found: ignore

      - name: Publish iOS build log to repo (diagnosis)
        # When the main build (gmake dsym package) fails, actual compilation errors are only in the job log.
        # As with the SFPEW log, blob storage makes it inaccessible, so commit the tee'd log back to the repository.
        # Its raw contents can be read to locate the exact file/line without manually downloading an artifact.
        if: matrix.platform_name == 'ios' && always() && failure()
        continue-on-error: true
        run: |
          set -e
          if [ ! -f ci-logs/ios-build.log ] && [ ! -f ci-logs/ios-build-trollstore.log ]; then
            echo "[ci] no ios build log captured -- gmake did not start"; exit 0
          fi
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/ios-build.log ci-logs/ios-build-trollstore.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(ios): publish main build log for diagnosis [skip ci]"
          git pull --rebase origin "$BRANCH_NAME" || true
          git push origin HEAD:"$BRANCH_NAME" || true

      - name: Publish SFPEW build log to repo (diagnosis)
        # dep_sfpew is invoked with `-$(MAKE)`, so failure does not stop the main build and its details are silently swallowed;
        # CI job logs / artifacts use blob storage and cannot be retrieved externally.
        # If SFPEW does not produce a dylib, commit its build log back to the repository (raw-readable)
        # to locate the problem directly without manually downloading an artifact.
        if: matrix.platform_name == 'ios' && always() && hashFiles('Natives/build/libSimpleFPEWrapper.dylib') == ''
        continue-on-error: true
        run: |
          set -e
          if [ ! -f Natives/build/sfpew_build.log ]; then
            echo "[ci] SFPEW: no build log -- dep_sfpew did not reach cmake"; exit 0
          fi
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          mkdir -p ci-logs
          cp Natives/build/sfpew_build.log ci-logs/sfpew-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/sfpew-build.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(sfpew): publish build log for diagnosis [skip ci]"
          git push origin HEAD:"$BRANCH_NAME" || { git pull --rebase origin "$BRANCH_NAME"; git push origin HEAD:"$BRANCH_NAME"; }

      - name: Verify the built binary really used the iOS 26 SDK
        run: |
          # ★ Verify: read the sdk field in the main binary's LC_BUILD_VERSION. 26.x means the iOS 26 SDK was actually used.
          BIN=$(find . -path '*Payload/*.app' -type d 2>/dev/null | head -1)
          APP=$(find . -name 'AngelAuraAmethyst' -type f 2>/dev/null | head -1)
          echo "★ app=$BIN bin=$APP"
          if [ -n "$APP" ]; then
            python3 - "$APP" <<'PY'
          import struct, sys
          b = open(sys.argv[1], 'rb').read()
          if b[:4] != b'\xcf\xfa\xed\xfe':
              print('★ Not a Mach-O'); raise SystemExit
          n = struct.unpack_from('<I', b, 16)[0]; off = 32
          for _ in range(n):
              cmd, cs = struct.unpack_from('<II', b, off)
              if cmd == 0x32:
                  plat, minos, sdk = struct.unpack_from('<III', b, off+8)
                  f = lambda v: '%d.%d.%d' % (v>>16&0xff, v>>8&0xff, v&0xff)
                  print('★★ LC_BUILD_VERSION: minOS=%s  SDK=%s' % (f(minos), f(sdk)))
                  print('★★ SDK>=26 ⇒ Liquid Glass is enabled; if 16/18 is shown, SDK 26 was not used and the build needs fixing')
                  break
              off += cs
          PY
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}.ipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
